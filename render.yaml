# Blueprint do Render: New → Blueprint → escolher este repositório.
# Variáveis com "sync: false" são pedidas no painel na hora de criar (nunca ficam no git).
services:
  - type: web
    name: jrbarber-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir src
    healthCheckPath: /api/servicos
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: COOKIE_SEGURO
        value: "1"
      - key: SEGREDO
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DONO_EMAIL
        sync: false
      - key: DONO_SENHA
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
